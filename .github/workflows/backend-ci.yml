name: Backend CI

on:
  push:
    branches: [master, main, develop, insightbridge-agents]
    paths:
      - 'adk-backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [master, main, develop]
    paths:
      - 'adk-backend/**'

jobs:
  test-and-lint:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          cd adk-backend
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt
          pip install flake8 black isort mypy

      - name: Lint with flake8
        run: |
          cd adk-backend
          # Stop the build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # Exit-zero treats all errors as warnings
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=100 --statistics
        continue-on-error: true

      - name: Check code formatting with black
        run: |
          cd adk-backend
          black --check . --line-length=100
        continue-on-error: true

      - name: Check import ordering with isort
        run: |
          cd adk-backend
          isort --check-only . --profile black
        continue-on-error: true

      - name: Type check with mypy
        run: |
          cd adk-backend
          mypy . --ignore-missing-imports --no-error-summary
        continue-on-error: true

      - name: Run pytest with coverage
        run: |
          cd adk-backend
          pytest tests/ -v --cov=. --cov-report=xml --cov-report=term-missing
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          PYTHONPATH: /github/workspace/adk-backend

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.11'
        uses: codecov/codecov-action@v3
        with:
          files: ./adk-backend/coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

      - name: Archive test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results-${{ matrix.python-version }}
          path: adk-backend/.pytest_cache/
          retention-days: 7

  integration-tests:
    runs-on: ubuntu-latest
    needs: test-and-lint

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          cd adk-backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Start FastAPI server
        run: |
          cd adk-backend
          nohup uvicorn main:app --host 0.0.0.0 --port 8080 > server.log 2>&1 &
          sleep 3
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}

      - name: Check server health
        run: |
          curl -f http://localhost:8080/health || exit 1
        timeout-minutes: 1

      - name: Run smoke tests
        run: |
          cd adk-backend
          python smoke_test.py
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        timeout-minutes: 5
        continue-on-error: true

      - name: Upload server logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-logs
          path: adk-backend/server.log
          retention-days: 7

  docker-build:
    runs-on: ubuntu-latest
    needs: test-and-lint

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build Docker image
        uses: docker/build-push-action@v4
        with:
          context: ./adk-backend
          file: ./adk-backend/Dockerfile
          push: false
          tags: pellucid-adk-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
